<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel administrativo — Frontera e Estilo</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --verde-selva:#000F24;
    --verde-selva-2:#0E1E38;
    --crema-lona:#F1F3F6;
    --blanco-hilo:#FBFBFC;
    --rojo:#D0121C;
    --verde-whats:#2F8F5B;
    --texto-oscuro:#101623;
    --texto-suave:#5C6470;
    --linea:#DDE1E7;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--crema-lona);
    color:var(--texto-oscuro);
    font-family:'Work Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .display{font-family:'Anton',sans-serif; letter-spacing:.02em; text-transform:uppercase;}
  .mono{font-family:'Space Mono',monospace;}
  img{max-width:100%;display:block;}

  header{
    background:var(--verde-selva);
    color:#fff;
    padding:16px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:3px solid var(--rojo);
  }
  header .marca{display:flex;align-items:center;gap:12px;}
  header .marca img{height:38px;border-radius:6px;}
  header .marca .display{font-size:19px;}
  header .marca small{display:block;color:var(--rojo);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;}
  .btn-salir{
    background:transparent;
    border:1px solid #45526B;
    color:#fff;
    padding:8px 16px;
    border-radius:20px;
    font-size:13px;
    cursor:pointer;
    font-family:'Work Sans',sans-serif;
  }

  main{max-width:900px;margin:0 auto;padding:36px 20px 80px;}

  /* -------- Login -------- */
  .login-box{
    max-width:380px;
    margin:60px auto;
    background:#fff;
    border:1px solid var(--linea);
    border-radius:6px;
    padding:32px 28px;
    text-align:center;
  }
  .login-box img{height:56px;margin:0 auto 18px;border-radius:6px;}
  .login-box h1{font-size:22px;margin:0 0 6px;}
  .login-box p{font-size:13.5px;color:var(--texto-suave);margin:0 0 22px;}
  .login-box input{
    width:100%;
    padding:11px 13px;
    border:1.5px solid var(--linea);
    border-radius:4px;
    font-size:14px;
    margin-bottom:12px;
    font-family:'Work Sans',sans-serif;
  }
  .login-box button{
    width:100%;
    background:var(--rojo);
    color:#fff;
    border:none;
    padding:12px;
    border-radius:4px;
    font-weight:700;
    font-size:14.5px;
    cursor:pointer;
    margin-top:6px;
  }
  .error-msg{color:var(--rojo);font-size:13px;margin-top:10px;min-height:16px;}

  /* -------- Formulario de producto -------- */
  .tarjeta-form{
    background:#fff;
    border:1px solid var(--linea);
    border-radius:6px;
    padding:26px;
    margin-bottom:36px;
  }
  .tarjeta-form h2{font-size:19px;margin:0 0 18px;}
  .campo{margin-bottom:16px;}
  .campo label{display:block;font-size:12.5px;font-weight:600;color:var(--texto-suave);margin-bottom:5px;text-transform:uppercase;letter-spacing:.03em;}
  .campo input, .campo select, .campo textarea{
    width:100%;
    padding:10px 12px;
    border:1.5px solid var(--linea);
    border-radius:4px;
    font-size:14px;
    font-family:'Work Sans',sans-serif;
  }
  .fila{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .fotos-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px;}
  .foto-slot{
    aspect-ratio:1/1;
    border:2px dashed var(--linea);
    border-radius:6px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    cursor:pointer;
    overflow:hidden;
    background:var(--crema-lona);
  }
  .foto-slot img{width:100%;height:100%;object-fit:cover;}
  .foto-slot .placeholder{font-size:11px;color:var(--texto-suave);text-align:center;padding:6px;font-family:'Space Mono',monospace;}
  .foto-slot .quitar{
    position:absolute;
    top:4px;
    right:4px;
    background:rgba(16,22,35,.75);
    color:#fff;
    border:none;
    width:20px;
    height:20px;
    border-radius:50%;
    font-size:12px;
    cursor:pointer;
    display:none;
  }
  .foto-slot.tiene-foto .quitar{display:block;}
  .botones-form{display:flex;gap:10px;margin-top:8px;}
  .btn-guardar{
    background:var(--rojo);
    color:#fff;
    border:none;
    padding:12px 24px;
    border-radius:4px;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
  }
  .btn-cancelar{
    background:transparent;
    border:1.5px solid var(--linea);
    padding:12px 20px;
    border-radius:4px;
    font-size:14px;
    cursor:pointer;
  }
  .estado-guardado{font-size:13px;margin-top:10px;min-height:16px;}
  .estado-guardado.ok{color:var(--verde-whats);}
  .estado-guardado.err{color:var(--rojo);}

  /* -------- Lista de productos -------- */
  .lista-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .lista-header h2{font-size:18px;margin:0;}
  .contador-lista{font-family:'Space Mono',monospace;font-size:12px;color:var(--texto-suave);}
  .fila-producto{
    display:flex;
    align-items:center;
    gap:14px;
    background:#fff;
    border:1px solid var(--linea);
    border-radius:6px;
    padding:12px 14px;
    margin-bottom:10px;
  }
  .fila-producto .miniatura{
    width:52px;height:52px;border-radius:4px;object-fit:cover;flex-shrink:0;background:var(--verde-selva);
  }
  .fila-producto .miniatura-vacia{
    width:52px;height:52px;border-radius:4px;flex-shrink:0;background:var(--verde-selva);
    display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Anton',sans-serif;font-size:16px;
  }
  .fila-producto .datos-fila{flex:1;min-width:0;}
  .fila-producto .datos-fila b{display:block;font-size:14.5px;}
  .fila-producto .datos-fila span{font-size:12.5px;color:var(--texto-suave);}
  .fila-producto .acciones{display:flex;gap:8px;flex-shrink:0;}
  .fila-producto .acciones button{
    border:none;
    background:var(--crema-lona);
    padding:7px 13px;
    border-radius:4px;
    font-size:12.5px;
    cursor:pointer;
  }
  .fila-producto .acciones .borrar{color:var(--rojo);}
  .vacio{text-align:center;padding:40px 20px;color:var(--texto-suave);font-size:13.5px;}

  #panel{display:none;}
</style>
</head>
<body>

<header>
  <div class="marca">
    <img src="assets/logo-mark.jpg" alt="Frontera e Estilo">
    <div>
      <div class="display">Frontera e Estilo</div>
      <small>Panel administrativo</small>
    </div>
  </div>
  <button class="btn-salir" id="btnSalir" style="display:none;" onclick="cerrarSesion()">Salir</button>
</header>

<main>

  <!-- ---------- LOGIN ---------- -->
  <div class="login-box" id="loginBox">
    <img src="assets/logo-mark.jpg" alt="Frontera e Estilo">
    <h1>Iniciar sesión</h1>
    <p>Ingresa con tu correo y contraseña de administrador.</p>
    <input type="email" id="loginEmail" placeholder="correo@ejemplo.com" autocomplete="username">
    <input type="password" id="loginPass" placeholder="Contraseña" autocomplete="current-password">
    <button onclick="iniciarSesion()">Entrar</button>
    <div class="error-msg" id="loginError"></div>
  </div>

  <!-- ---------- PANEL (visible tras iniciar sesión) ---------- -->
  <div id="panel">

    <div class="tarjeta-form">
      <h2 id="tituloForm">Agregar producto nuevo</h2>

      <div class="fotos-grid" id="fotosGrid"></div>

      <div class="campo">
        <label>Nombre del producto</label>
        <input type="text" id="fNombre" placeholder="Ej: Camisa lino manga corta">
      </div>

      <div class="fila">
        <div class="campo">
          <label>Categoría</label>
          <select id="fCategoria"></select>
        </div>
        <div class="campo">
          <label>Precio (USD)</label>
          <input type="number" id="fPrecio" step="0.01" min="0" placeholder="Ej: 18">
        </div>
      </div>

      <div class="campo">
        <label>Descripción (tallas, colores, detalles)</label>
        <textarea id="fDescripcion" rows="2" placeholder="Ej: Tallas S–XL · Varios colores"></textarea>
      </div>

      <div class="botones-form">
        <button class="btn-guardar" onclick="guardarProducto()" id="btnGuardar">Guardar producto</button>
        <button class="btn-cancelar" onclick="cancelarEdicion()">Cancelar</button>
      </div>
      <div class="estado-guardado" id="estadoGuardado"></div>
    </div>

    <div class="lista-header">
      <h2>Productos cargados</h2>
      <span class="contador-lista" id="contadorLista"></span>
    </div>
    <div id="listaProductos"></div>

  </div>
</main>

<script>
/* =========================================================
   CONFIGURACIÓN — debe ser IGUAL a la de index.html
   ========================================================= */
const SUPABASE_URL = "https://vquvynvmmshrffugdvrc.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_QmI456q9vXhw3clqbyqvyQ_LDNh1ED4";
const BUCKET = "fotos-productos";
const CATEGORIAS = ["Hombres","Mujeres","Niños","Accesorios"];

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ---------- Estado del formulario ---------- */
let editandoId = null;
let slotFiles = [null, null, null, null];   // archivos nuevos elegidos (File)
let slotUrls  = [null, null, null, null];   // fotos ya existentes (URL) o preview local

document.getElementById('fCategoria').innerHTML =
  CATEGORIAS.map(c => `<option value="${c}">${c}</option>`).join('');

/* ---------- Sesión ---------- */
async function verificarSesion(){
  const { data } = await sb.auth.getSession();
  if(data.session){
    mostrarPanel();
  } else {
    document.getElementById('loginBox').style.display = 'block';
    document.getElementById('panel').style.display = 'none';
    document.getElementById('btnSalir').style.display = 'none';
  }
}

async function iniciarSesion(){
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  const err = document.getElementById('loginError');
  err.textContent = '';
  if(!email || !pass){ err.textContent = 'Completa correo y contraseña.'; return; }
  const { error } = await sb.auth.signInWithPassword({ email, password: pass });
  if(error){ err.textContent = 'Correo o contraseña incorrectos.'; return; }
  mostrarPanel();
}

async function cerrarSesion(){
  await sb.auth.signOut();
  location.reload();
}

function mostrarPanel(){
  document.getElementById('loginBox').style.display = 'none';
  document.getElementById('panel').style.display = 'block';
  document.getElementById('btnSalir').style.display = 'inline-block';
  renderFotosGrid();
  cargarLista();
}

/* ---------- Slots de fotos (hasta 4) ---------- */
function renderFotosGrid(){
  const cont = document.getElementById('fotosGrid');
  cont.innerHTML = slotUrls.map((url, i) => `
    <div class="foto-slot ${url ? 'tiene-foto' : ''}" onclick="elegirFoto(${i})">
      ${url ? `<img src="${url}">` : `<span class="placeholder">Foto ${i+1}</span>`}
      <button class="quitar" onclick="quitarFoto(event, ${i})">✕</button>
    </div>
  `).join('');
}

function elegirFoto(i){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.onchange = () => {
    if(input.files && input.files[0]){
      slotFiles[i] = input.files[0];
      slotUrls[i] = URL.createObjectURL(input.files[0]);
      renderFotosGrid();
    }
  };
  input.click();
}

function quitarFoto(e, i){
  e.stopPropagation();
  slotFiles[i] = null;
  slotUrls[i] = null;
  renderFotosGrid();
}

/* ---------- Guardar (crear o editar) ---------- */
async function guardarProducto(){
  const nombre = document.getElementById('fNombre').value.trim();
  const categoria = document.getElementById('fCategoria').value;
  const precio = parseFloat(document.getElementById('fPrecio').value);
  const descripcion = document.getElementById('fDescripcion').value.trim();
  const estado = document.getElementById('estadoGuardado');
  const btn = document.getElementById('btnGuardar');

  estado.className = 'estado-guardado';
  estado.textContent = '';

  if(!nombre || !categoria || isNaN(precio)){
    estado.className = 'estado-guardado err';
    estado.textContent = 'Completa al menos el nombre, la categoría y el precio.';
    return;
  }

  btn.disabled = true;
  estado.textContent = 'Guardando...';

  try{
    // Sube solo las fotos NUEVAS (las que ya eran una URL se mantienen igual)
    const fotosFinal = [];
    for(let i = 0; i < 4; i++){
      if(slotFiles[i]){
        const archivo = slotFiles[i];
        const nombreArchivo = `${Date.now()}-${i}-${archivo.name.replace(/[^a-zA-Z0-9.]/g,'_')}`;
        const { error: errorSubida } = await sb.storage.from(BUCKET).upload(nombreArchivo, archivo);
        if(errorSubida) throw errorSubida;
        const { data: pub } = sb.storage.from(BUCKET).getPublicUrl(nombreArchivo);
        fotosFinal.push(pub.publicUrl);
      } else if(slotUrls[i] && slotUrls[i].startsWith('http')){
        fotosFinal.push(slotUrls[i]); // foto existente que no se cambió
      }
    }

    const registro = { nombre, categoria, precio, descripcion, fotos: fotosFinal };

    if(editandoId){
      const { error } = await sb.from('productos').update(registro).eq('id', editandoId);
      if(error) throw error;
    } else {
      const { error } = await sb.from('productos').insert(registro);
      if(error) throw error;
    }

    estado.className = 'estado-guardado ok';
    estado.textContent = '¡Producto guardado! Ya está visible en el catálogo.';
    limpiarFormulario();
    cargarLista();
  } catch(e){
    console.error(e);
    estado.className = 'estado-guardado err';
    estado.textContent = 'Ocurrió un error al guardar. Revisa tu conexión e inténtalo de nuevo.';
  } finally {
    btn.disabled = false;
  }
}

function limpiarFormulario(){
  editandoId = null;
  slotFiles = [null,null,null,null];
  slotUrls = [null,null,null,null];
  document.getElementById('fNombre').value = '';
  document.getElementById('fCategoria').selectedIndex = 0;
  document.getElementById('fPrecio').value = '';
  document.getElementById('fDescripcion').value = '';
  document.getElementById('tituloForm').textContent = 'Agregar producto nuevo';
  renderFotosGrid();
}

function cancelarEdicion(){
  limpiarFormulario();
  document.getElementById('estadoGuardado').textContent = '';
}

/* ---------- Lista de productos existentes ---------- */
let productosCache = [];

async function cargarLista(){
  const cont = document.getElementById('listaProductos');
  const { data, error } = await sb.from('productos').select('*').order('creado_en', { ascending:false });
  if(error){
    cont.innerHTML = `<div class="vacio">No se pudo cargar la lista de productos.</div>`;
    return;
  }
  productosCache = data || [];
  document.getElementById('contadorLista').textContent = `${productosCache.length} producto${productosCache.length!==1?'s':''}`;

  if(productosCache.length === 0){
    cont.innerHTML = `<div class="vacio">Todavía no hay productos cargados. Usa el formulario de arriba para agregar el primero.</div>`;
    return;
  }

  cont.innerHTML = productosCache.map(p => `
    <div class="fila-producto">
      ${ (p.fotos && p.fotos[0])
          ? `<img class="miniatura" src="${p.fotos[0]}">`
          : `<div class="miniatura-vacia">${(p.nombre||'?').charAt(0).toUpperCase()}</div>` }
      <div class="datos-fila">
        <b>${p.nombre}</b>
        <span>${p.categoria} · $${p.precio} · ${(p.fotos||[]).length} foto${(p.fotos||[]).length!==1?'s':''}</span>
      </div>
      <div class="acciones">
        <button onclick="editarProducto(${p.id})">Editar</button>
        <button class="borrar" onclick="borrarProducto(${p.id})">Borrar</button>
      </div>
    </div>
  `).join('');
}

function editarProducto(id){
  const p = productosCache.find(x => x.id === id);
  if(!p) return;
  editandoId = id;
  document.getElementById('fNombre').value = p.nombre || '';
  document.getElementById('fCategoria').value = p.categoria || '';
  document.getElementById('fPrecio').value = p.precio ?? '';
  document.getElementById('fDescripcion').value = p.descripcion || '';
  slotFiles = [null,null,null,null];
  slotUrls = [null,null,null,null];
  (p.fotos || []).slice(0,4).forEach((url,i) => slotUrls[i] = url);
  document.getElementById('tituloForm').textContent = `Editando: ${p.nombre}`;
  renderFotosGrid();
  window.scrollTo({top:0, behavior:'smooth'});
}

async function borrarProducto(id){
  if(!confirm('¿Seguro que quieres borrar este producto? Esta acción no se puede deshacer.')) return;
  const { error } = await sb.from('productos').delete().eq('id', id);
  if(error){ alert('No se pudo borrar el producto.'); return; }
  cargarLista();
}

verificarSesion();
</script>

</body>
</html>
